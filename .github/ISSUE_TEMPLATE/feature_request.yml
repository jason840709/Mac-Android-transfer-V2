name: Feature request
description: 建議新功能或改善
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或補充資訊
